services:
  nginx:
    image: ${REGISTRY}/${NAMESPACE}/myapp-nginx:${TAG}
    container_name: yuktiprep-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - client
      - web
      - admin
      - backend
    networks:
      - yukti-network

  backend:
    image: ${REGISTRY}/${NAMESPACE}/myapp-backend:${TAG}
    container_name: yuktiprep-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env          
    environment:
      - PORT=4000
      - NODE_ENV=production
      - FRONTEND_URL=http://client.yuktiprep.com
      - APP_FRONTEND_URL=http://ap.yuktiprep.com
      - ADMIN_FRONTEND_URL=http://ad.yuktiprep.com
    expose:
      - "4000"
    depends_on:
      - postgres
    networks:
      - yukti-network

  client:
    image: ${REGISTRY}/${NAMESPACE}/myapp-client:${TAG}
    container_name: yuktiprep-client
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=production
    expose:
      - "3000"
    networks:
      - yukti-network

  web:
    image: ${REGISTRY}/${NAMESPACE}/myapp-web:${TAG}
    container_name: yuktiprep-web
    restart: unless-stopped
    environment:
      - PORT=5001
      - NODE_ENV=production
    expose:
      - "5001"
    networks:
      - yukti-network

  admin:
    image: ${REGISTRY}/${NAMESPACE}/myapp-admin:${TAG}
    container_name: yuktiprep-admin
    restart: unless-stopped
    environment:
      - PORT=5000
      - NODE_ENV=production
    expose:
      - "5000"
    networks:
      - yukti-network

  postgres:
    image: postgres:16-alpine
    container_name: yuktiprep-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env on the VM}
      POSTGRES_DB: ${POSTGRES_DB:-yuktiprep}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - yukti-network

volumes:
  postgres_data:
    driver: local

networks:
  yukti-network:
    driver: bridge
