name: CICD

on:
  push:
    branches: ["feature/**"]

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false   

permissions:
  contents: read

env:
  REGISTRY: registry.utho.com
  NAMESPACE: ${{ vars.REGISTRY_NAMESPACE }}
  TAG: ${{ github.sha }}                       
  SERVICES: "backend client admin"
  HEALTH_PATH: ${{ vars.HEALTH_PATH || '/health' }}

jobs:

  ci:
    name: Lint, tests, secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Secret scan
        env:
          GITLEAKS_VERSION: v8.28.0
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --exit-code 1 --redact -v

      - name: Lint + tests
        run: |
          set -euo pipefail
          for d in $SERVICES; do
            [ -d "$d" ] || continue
            if [ -f "$d/package.json" ]; then
              (cd "$d" && npm ci && npm run lint --if-present && npm test --if-present)
            fi
            if [ -f "$d/requirements.txt" ]; then
              (cd "$d" && pip install -q ruff pytest -r requirements.txt && ruff check . && pytest)
            fi
          done

  build:
    name: Build ${{ matrix.service }}
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write            
    strategy:
      fail-fast: true
      matrix:
        service: [backend, client, admin]   
    env:
      IMAGE: registry.utho.com/${{ vars.REGISTRY_NAMESPACE }}/myapp-${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      
      - name: Get registry credentials from Vault (OIDC)
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ vars.VAULT_ADDR }}
          method: jwt
          role: ${{ vars.VAULT_ROLE }}
          secrets: |
            secret/data/utho registry_user | REGISTRY_USER ;
            secret/data/utho registry_password | REGISTRY_PASSWORD

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Docker test stage (runs only if the Dockerfile defines one)
        working-directory: ${{ matrix.service }}
        run: |
          if grep -qiE '^FROM .* AS test' Dockerfile; then
            docker build --target test .
          else
            echo "no test stage defined - skipping"
          fi

      - name: Build + push immutable image (myapp:GIT_SHA)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            GIT_SHA=${{ env.TAG }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - name: SBOM + sign
        run: |
          set -euo pipefail
          REF="${IMAGE}@${{ steps.build.outputs.digest }}"
          syft "$REF" -o spdx-json=sbom.spdx.json
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom.spdx.json
          retention-days: 90

  validate:
    name: Validate config and secrets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      UTHO_API_KEY: ${{ secrets.UTHO_API_KEY }}
      STAGING_URL: ${{ vars.STAGING_URL }}
      PROD_URL: ${{ vars.PROD_URL }}
      REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE }}
    steps:
      - name: Fail fast if anything is missing
        run: |
          missing=0
          for v in STAGING_SSH_HOST STAGING_SSH_USER STAGING_SSH_KEY PROD_SSH_HOST PROD_SSH_USER PROD_SSH_KEY UTHO_API_KEY STAGING_URL PROD_URL REGISTRY_NAMESPACE; do
            if [ -z "${!v:-}" ]; then echo "::error::$v is not set"; missing=1; fi
          done
          exit $missing

  deploy-staging:
    name: Deploy to staging VM
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Pull the same image and start it
        uses: appleboy/ssh-action@v1.2.0
        env:
          TAG: ${{ env.TAG }}
          REGISTRY: ${{ env.REGISTRY }}
          NAMESPACE: ${{ env.NAMESPACE }}
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: TAG,REGISTRY,NAMESPACE
          script: |
            set -euo pipefail
            cd ${{ vars.DEPLOY_PATH || '~/app' }}
            export TAG REGISTRY NAMESPACE
            docker compose pull
            docker compose up -d --remove-orphans

  staging-tests:
    name: Staging tests (health, smoke, nmap, k6)
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STAGING_URL: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Health checks
        run: |
          for i in $(seq 1 30); do
            curl -fsS -m 10 "$STAGING_URL$HEALTH_PATH" && exit 0
            echo "not healthy yet ($i/30)"; sleep 10
          done
          echo "::error::staging never became healthy"; exit 1

      - name: Smoke tests
        run: |
          curl -fsS -m 10 -o /dev/null "$STAGING_URL/"
          if [ -x scripts/smoke.sh ]; then scripts/smoke.sh "$STAGING_URL"; fi

      - name: Nmap scan (only ports 22, 80, 443 may be open)
        run: |
          set -uo pipefail
          sudo apt-get install -y -qq nmap
          HOST=$(echo "$STAGING_URL" | sed -E 's#https?://##; s#[:/].*##')
          open=$(nmap -Pn --open -oG - "$HOST" | grep -oE '[0-9]+/open' | cut -d/ -f1 | tr '\n' ' ')
          echo "open ports: $open"
          bad=0
          for p in $open; do
            case "$p" in 22|80|443) ;; *) echo "::error::unexpected open port $p"; bad=1;; esac
          done
          exit $bad

      - uses: grafana/setup-k6-action@v1
      - name: K6 load test
        run: |
          cat > k6.js <<'JS'
          import http from 'k6/http';
          import { check, sleep } from 'k6';
          export const options = {
            vus: 20,
            duration: '1m',
            thresholds: { http_req_failed: ['rate<0.01'], http_req_duration: ['p(95)<800'] },
          };
          export default function () {
            const r = http.get(__ENV.TARGET);
            check(r, { 'status 200': (x) => x.status === 200 });
            sleep(1);
          }
          JS
          k6 run -e TARGET="$STAGING_URL" k6.js

  approval:
    name: Production approval
    needs: staging-tests
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Approved for production - ${{ env.TAG }}"

  migrate:
    name: DB migration (expand)
    needs: approval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run expand-only migration
        uses: appleboy/ssh-action@v1.2.0
        env:
          MIGRATE_CMD: ${{ vars.MIGRATE_CMD }}
          TAG: ${{ env.TAG }}
          REGISTRY: ${{ env.REGISTRY }}
          NAMESPACE: ${{ env.NAMESPACE }}
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: MIGRATE_CMD,TAG,REGISTRY,NAMESPACE
          script: |
            set -euo pipefail
            cd ${{ vars.DEPLOY_PATH || '~/app' }}
            export TAG REGISTRY NAMESPACE
            if [ -n "${MIGRATE_CMD:-}" ]; then bash -c "$MIGRATE_CMD"; else echo "no MIGRATE_CMD set - skipping"; fi

  release:
    name: Release to Auto Scaling Group
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      prev: ${{ steps.prev.outputs.prev }}
    env:
      PROD_URL: ${{ vars.PROD_URL }}
      UTHO_API_KEY: ${{ secrets.UTHO_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Remember the currently running version (for rollback)
        id: prev
        run: echo "prev=$(curl -fsS -m 10 "$PROD_URL/version" || true)" >> "$GITHUB_OUTPUT"

      - name: Set desired image on the Auto Scaling Group (rolling update)
        env:
          IMAGE_TAG: ${{ env.TAG }}
        run: ./scripts/utho-set-release.sh "$IMAGE_TAG"

      - name: Observation window
        env:
          MINUTES: ${{ vars.OBSERVE_MINUTES || '15' }}
        run: |
          set -uo pipefail
          end=$(( $(date +%s) + MINUTES * 60 )); total=0; bad=0
          while [ "$(date +%s)" -lt "$end" ]; do
            total=$((total + 1))
            curl -fsS -m 10 -o /dev/null "$PROD_URL$HEALTH_PATH" || bad=$((bad + 1))
            sleep 30
          done
          echo "probes=$total failed=$bad"
          [ $((bad * 100)) -le $((total * 2)) ]     # healthy = error rate <= 2%

  rollback:
    name: Auto rollback
    needs: release
    if: ${{ always() && needs.release.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UTHO_API_KEY: ${{ secrets.UTHO_API_KEY }}
      PREV: ${{ needs.release.outputs.prev }}
    steps:
      - uses: actions/checkout@v4
      - name: Roll back to the previous GIT_SHA
        run: |
          [ -n "$PREV" ] || { echo "::error::no previous version recorded - roll back manually"; exit 1; }
          ./scripts/utho-set-release.sh "$PREV"