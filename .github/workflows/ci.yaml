name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SERVICES: "backend client admin"   

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          for d in $SERVICES; do
            [ -d "$d" ] || continue
            if [ -f "$d/package.json" ]; then
              (cd "$d" && npm ci && npm run lint --if-present)
            fi
            if [ -f "$d/requirements.txt" ]; then
              (cd "$d" && pip install -q ruff -r requirements.txt && ruff check .)
            fi
          done

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          for d in $SERVICES; do
            [ -d "$d" ] || continue
            if [ -f "$d/package.json" ]; then
              (cd "$d" && npm ci && npm test --if-present)
            fi
            if [ -f "$d/requirements.txt" ]; then
              (cd "$d" && pip install -q pytest -r requirements.txt && pytest)
            fi
          done

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          GITLEAKS_VERSION: v8.28.0
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --exit-code 1 --redact -v

  sbom-sign:
    name: SBOM + cosign signing
    needs: [lint, test, secret-scan]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write   
    steps:
      - uses: actions/checkout@v4

      - uses: anchore/sbom-action/download-syft@v0
      - uses: sigstore/cosign-installer@v3

      - name: Generate SBOM (SPDX)
        run: syft dir:. -o spdx-json=sbom.spdx.json

      - name: Sign SBOM
        run: cosign sign-blob --yes --bundle sbom.cosign.bundle sbom.spdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.cosign.bundle
          retention-days: 90